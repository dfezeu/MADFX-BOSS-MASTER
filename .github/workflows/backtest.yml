name: Backtest Runner

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:      # Allow manual triggering

jobs:
  backtest:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run backtests
      run: npm run backtest
      
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backtest-results
        path: backtest/results/
        
    - name: Post results to Telegram
      if: always()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        # Only post if Telegram credentials are configured
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          # Get the workflow run URL
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # Create message with status
          if [ "${{ job.status }}" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="Success"
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="Failed"
          fi
          
          MESSAGE="${STATUS_EMOJI} MADFX BOSS Backtest ${STATUS_TEXT}
          
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          
          Run Details: ${WORKFLOW_URL}"
          
          # Send to Telegram
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "{
              \"chat_id\": \"${TELEGRAM_CHAT_ID}\",
              \"text\": \"${MESSAGE}\",
              \"parse_mode\": \"HTML\"
            }"
        fi
        
    - name: Post results to Slack/Webhook (if configured)
      if: always()
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        # Only post if webhook URLs are configured
        if [ -n "$SLACK_WEBHOOK_URL" ]; then
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"MADFX BOSS Backtest Results: Check GitHub Actions for detailed results."}' \
            $SLACK_WEBHOOK_URL
        fi
        
        if [ -n "$DISCORD_WEBHOOK_URL" ]; then
          curl -X POST -H 'Content-type: application/json' \
            --data '{"content":"MADFX BOSS Backtest Results: Check GitHub Actions for detailed results."}' \
            $DISCORD_WEBHOOK_URL
        fi
